name: Presentation and questions
description: Tuesday 8 December. Posted by the instructor or a TL after your presentation.
title: "Final Project presentation"
labels: ["presentation"]
body:
  - type: markdown
    attributes:
      value: |
        The instructor or a TL posts this issue after your presentation. It records your score for
        the presentation and for your answers to the questions that follow it. The questions ask you
        to explain parts of your agent team from your own repository and log, including any code an
        AI tool wrote for you.
  - type: checkboxes
    attributes:
      label: Presentation, 3 points
      options:
        - label: The task, the person, and the reason an agent team was worth building
        - label: Each agent with its role, its model, and how the lead reaches it
        - label: One tool with its guardrail, and the line where the lead reaches another agent, each explained
        - label: One run walked through step by step, live or from the log
        - label: The evaluation tables and what they show
  - type: input
    attributes:
      label: Presentation score, out of 3
    validations:
      required: true
  - type: textarea
    attributes:
      label: Questions about your work, 3 points
      description: Each answer is 3 (explained it from the code or log), 2 (explained it with gaps), 1 (partly), or 0 (could not). The score is the average, rounded to the nearest half point. When students work together, each one is scored on their own answers.
      value: |
        | Asked about | Outcome |
        | --- | --- |
        |  |  |
  - type: input
    attributes:
      label: Questions score, out of 3
    validations:
      required: true
